<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#07172b" />
    
    <!-- Preload Brand Logo to eliminate layout shift / drift -->
    <link rel="preload" as="image" href="/logo.png" />

    <!-- PWA Web App Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mahajan Report" />
    <meta name="application-name" content="Mahajan Report" />

    <title>Mahajan Facilities — Daily Cleaning Report Generator</title>
  </head>
  <body>
    <div id="app">
      <!-- High-res Instant Brand Loader (Eliminates layout shift & drift while app initializes) -->
      <div id="initial-app-loader" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ffffff; padding: 20px; text-align: center;">
        <img src="/logo.png" alt="Mahajan Facilities" width="140" height="140" style="width: 140px; height: 140px; object-fit: contain; margin-bottom: 16px; filter: drop-shadow(0 4px 12px rgba(12, 35, 64, 0.1));" />
        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 19px; font-weight: 800; color: #07172b; letter-spacing: 0.8px; text-transform: uppercase;">MAHAJAN FACILITIES</div>
        <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; font-weight: 700; color: #c59b27; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 4px;">Smart Solutions</div>
      </div>
    </div>
    <div id="toast-container" class="toast-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
